
windowrule = float, class:(^org.Waytrogen.Waytrogen)

windowrulev2 = opaque,title:^(Picture in picture)$
windowrulev2 = float,class:^(org.gnome.NautilusPreviewer)$
windowrulev2 = float,class:^(ru-turikhay-tlauncher-bootstrap-Bootstrap)$
windowrule = float, class: xdg-desktop-portal-gtk
windowrule = pin, class: xdg-desktop-portal-gtk
windowrule = stayfocused, class: xdg-desktop-portal-gtk
windowrule = pin, class:org.Waytrogen.Waytrogen
windowrule = move 40% 69%, class:org.Waytrogen.Waytrogen
windowrule = size 20% 30%, class:org.Waytrogen.Waytrogen
windowrule = suppressevent maximize, class:.*

windowrulev2 = workspace special:qspace, class:^(org.telegram.desktop)$
windowrule = size 40% 95%, class:^(org.telegram.desktop)$
windowrule = move 1% 4%, class:^(org.telegram.desktop)$
windowrule = float, class:^(org.telegram.desktop)$
# Fix some dragging issues with XWayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

windowrule = float,class:^(kitty)$,title:^(kitty)$, onworkspace [e]
